<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>和弦蠑螈</title>
<style>
:root{
  --pink:#ff7fb6; --pink-deep:#e0568f; --pink-soft:#ffd6e8;
  --aqua:#4fd6e0; --bg:#14101c; --bg2:#1e1830; --bg3:#2a2142;
  --ink:#fff2f8; --dim:#b9a8cc; --ok:#5ce6a0; --bad:#ff6b6b; --warn:#ffd166;
  --line:#3b3158;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{
  background:radial-gradient(1200px 700px at 50% -10%, #35254f 0%, var(--bg) 60%);
  color:var(--ink);
  font-family:"PingFang TC","Heiti TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:18px 24px;overflow:auto}
.screen.on{display:flex}
h1{font-size:44px;margin:0;letter-spacing:2px}
h2{font-size:24px;margin:0 0 10px}
.sub{color:var(--dim);font-size:15px;line-height:1.7}

.btn{
  background:linear-gradient(180deg,var(--pink),var(--pink-deep));
  color:#fff;border:0;border-radius:14px;padding:14px 26px;font-size:18px;font-weight:700;
  box-shadow:0 6px 0 #a33468, 0 10px 24px rgba(0,0,0,.35);transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a33468}
.btn.ghost{background:transparent;border:2px solid var(--line);box-shadow:none;color:var(--ink);font-weight:600}
.btn.ghost:active{transform:translateY(2px)}
.btn.small{padding:8px 16px;font-size:15px;border-radius:10px;box-shadow:0 4px 0 #a33468}
.btn.aqua{background:linear-gradient(180deg,#63e3ec,#25a8b4);box-shadow:0 6px 0 #17747d}
.btn:disabled{opacity:.4;pointer-events:none}

.card{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
select,input[type=text],input[type=number]{
  background:var(--bg3);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:15px;font-family:inherit;
}
input[type=range]{accent-color:var(--pink)}
.tag{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--bg3);color:var(--dim);border:1px solid var(--line)}

/* ---------- 蠑螈 ---------- */
.axo-wrap{position:relative;width:100%;display:flex;flex-direction:column;align-items:center;flex:none}
#axo{width:min(300px,100%);image-rendering:auto;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45));
  animation:idle 2.6s ease-in-out infinite;transform-origin:50% 85%}
@keyframes idle{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1.5deg)}}
#axo.happy{animation:happy .5s ease-out 2}
@keyframes happy{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-38px) scale(1.08) rotate(-6deg)}60%{transform:translateY(0) scale(.96)}100%{transform:translateY(0) scale(1)}}
#axo.sad{animation:sad .5s ease-in-out 1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.45)) saturate(.45)}
@keyframes sad{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg) translateY(6px)}75%{transform:rotate(7deg) translateY(6px)}}
#axo.cheer{animation:cheer .9s ease-in-out infinite}
@keyframes cheer{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-26px) rotate(8deg)}}
.bubble{
  background:#fff;color:#5a2a44;border-radius:16px;padding:8px 14px;font-weight:800;font-size:17px;
  position:relative;margin-bottom:6px;min-height:20px;box-shadow:0 6px 14px rgba(0,0,0,.3);opacity:0;transition:opacity .2s
}
.bubble.show{opacity:1}
.bubble:after{content:"";position:absolute;bottom:-9px;left:50%;margin-left:-8px;border:9px solid transparent;border-top-color:#fff;border-bottom:0}
.fx{position:absolute;pointer-events:none;font-size:28px;animation:fxup 1s ease-out forwards}
@keyframes fxup{0%{opacity:1;transform:translate(0,0) scale(.7)}100%{opacity:0;transform:translate(var(--dx),-90px) scale(1.4)}}

/* ---------- 指板圖 ---------- */
.chordbox{display:flex;flex-direction:column;align-items:center;gap:6px}
.chordname{font-size:64px;font-weight:900;letter-spacing:1px;line-height:1}
.chordname.next{font-size:26px;color:var(--dim);font-weight:700}

/* ---------- 遊戲版面 ---------- */
#playTop{display:flex;gap:18px;align-items:stretch;flex:none}
#playMid{flex:1;display:grid;grid-template-columns:300px minmax(300px,1fr) 180px 250px;
  align-items:center;gap:20px;min-height:0;padding:4px 0}
@media (max-width:1180px){
  #playMid{grid-template-columns:220px 1fr 160px}
  #detect{display:none}
}
@media (max-width:820px){
  #playMid{grid-template-columns:150px 1fr}
  .chordbox.nextbox{display:none}
}
.hud{display:flex;gap:18px;align-items:center;justify-content:space-between;flex:none;margin-bottom:8px}
.stat{text-align:center;min-width:88px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:12px;color:var(--dim)}
#comboBig{font-size:40px;font-weight:900;color:var(--warn);min-height:46px;text-shadow:0 3px 0 rgba(0,0,0,.4)}

/* 節奏道 */
#lane{position:relative;height:118px;background:linear-gradient(180deg,#221a38,#191330);
  border:1px solid var(--line);border-radius:16px;flex:none;overflow:hidden}
.beatline{position:absolute;top:0;bottom:0;width:1px;background:#3a3057}
.beatline.strong{background:#5b4c85;width:2px}
.hitzone{position:absolute;top:0;bottom:0;width:4px;background:var(--pink);box-shadow:0 0 18px var(--pink);left:14%}
.note{position:absolute;top:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;color:#fff;
  text-shadow:0 2px 6px rgba(0,0,0,.6);transition:opacity .15s}
.note.hit{color:var(--ok);opacity:.35}
.note.miss{color:var(--bad);opacity:.35}
.judge{position:absolute;left:14%;top:8px;transform:translateX(-50%);font-size:22px;font-weight:900;opacity:0}
.judge.show{animation:judgePop .6s ease-out}
@keyframes judgePop{0%{opacity:1;transform:translateX(-50%) scale(1.4)}100%{opacity:0;transform:translateX(-50%) scale(1) translateY(-18px)}}

/* 偵測面板 */
#detect{width:250px;flex:none}
.chroma{display:flex;gap:3px;align-items:flex-end;height:74px}
.chroma div{flex:1;background:linear-gradient(180deg,var(--aqua),#1b6f78);border-radius:3px 3px 0 0;height:2%;transition:height .06s linear}
.chroma div.hot{background:linear-gradient(180deg,var(--pink),var(--pink-deep))}
.chromaLbl{display:flex;gap:3px;font-size:9px;color:var(--dim);margin-top:3px}
.chromaLbl div{flex:1;text-align:center}
#meter{height:12px;background:var(--bg3);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
#meterBar{height:100%;width:0%;background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad));transition:width .05s}
#guess{font-size:30px;font-weight:900;text-align:center;margin:6px 0 2px}
#guessConf{font-size:12px;color:var(--dim);text-align:center}

/* 歌曲清單 */
.songgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
.song{background:rgba(255,255,255,.05);border:2px solid var(--line);border-radius:16px;padding:14px 16px;cursor:pointer;transition:.12s}
.song:hover{border-color:var(--pink);transform:translateY(-3px)}
.song.sel{border-color:var(--pink);background:rgba(255,127,182,.14)}
.song h3{margin:0 0 4px;font-size:20px}
.song p{margin:0;font-size:13px;color:var(--dim);line-height:1.6}
.diff{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.diff button{flex:1;min-width:110px;border-radius:14px;border:2px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--ink);padding:12px 10px;font-size:15px;font-weight:700;transition:.12s}
.diff button.sel{border-color:var(--pink);background:rgba(255,127,182,.18)}
.diff button small{display:block;font-weight:400;font-size:11px;color:var(--dim);margin-top:3px}

table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border:1px solid var(--line);padding:6px 9px;text-align:left}
th{background:var(--bg3);color:var(--dim);font-weight:600}
.note-warn{background:rgba(255,209,102,.1);border:1px solid rgba(255,209,102,.4);border-radius:12px;padding:10px 14px;font-size:13px;color:#ffe6ab;line-height:1.7}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
textarea{width:100%;height:150px;background:var(--bg3);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.hide{display:none !important}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);
  padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99}
#toast.on{opacity:1}
</style>
</head>
<body>
